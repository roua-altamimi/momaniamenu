<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Order Calculator</title>
<style>
  :root{
    --paper:#f8f4ef;
    --panel:#fffdf9;
    --ink:#2d2926;
    --muted:#77706a;
    --line:#e6ddd4;
    --accent:#b0876a;
    --accent-dark:#8f684e;
    --danger:#a84235;
    --shadow:0 10px 30px rgba(70,52,40,.08);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
  img,svg,canvas{max-width:100%;height:auto}
  button,input{font:inherit}
  button{cursor:pointer}
  .app{max-width:1220px;margin:0 auto;padding:24px 16px 46px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}
  .brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,4vw,44px);font-weight:500;letter-spacing:.02em}
  .brand p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .clear-all{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 14px}
  .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.75fr);gap:18px;align-items:start}
  .menu-panel,.order-panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .menu-panel{padding:16px}
  .tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(176,135,106,.13)}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:thin}
  .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 12px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .item-list{display:grid;gap:8px}
  .menu-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:13px 12px;border:1px solid transparent;border-bottom-color:var(--line);align-items:center}
  .menu-item:last-child{border-bottom-color:transparent}
  .menu-item:hover{background:#fbf7f2;border-color:var(--line);border-radius:15px}
  .item-name{font-weight:700;font-size:15px}
  .item-desc{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:4px}
  .item-meta{display:flex;align-items:center;gap:10px;justify-content:flex-end}
  .price{color:var(--accent-dark);font-weight:800;white-space:nowrap}
  .add{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;line-height:1}
  .unavailable{opacity:.55}
  .unavailable .add{background:#d8d1cb;cursor:not-allowed}
  .order-panel{padding:16px;position:sticky;top:12px}
  .order-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
  .order-head h2{font-family:Georgia,"Times New Roman",serif;margin:0;font-size:25px;font-weight:500}
  .count-pill{font-size:12px;background:#eee8e2;border-radius:999px;padding:5px 9px;color:var(--muted)}
  .empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
  .cart{display:grid;gap:10px}
  .cart-line{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
  .cart-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
  .cart-title{font-weight:750;font-size:14px;line-height:1.35}
  .line-price{font-weight:800;color:var(--accent-dark);white-space:nowrap}
  .extras-text{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
  .cart-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .qty{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px}
  .qty button{width:30px;height:30px;border:0;background:#f2ece6;border-radius:50%;font-size:18px}
  .qty span{min-width:22px;text-align:center;font-weight:700}
  .line-actions{display:flex;gap:6px}
  .small-btn{border:0;background:transparent;color:var(--accent-dark);padding:7px 8px;border-radius:8px;font-size:12px}
  .small-btn.remove{color:var(--danger)}
  .totals{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .sum-row span{color:var(--muted);font-size:13px}
  .sum-row strong{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:500}
  .helper{font-size:11px;color:var(--muted);margin-top:5px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(39,31,26,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
  .modal-backdrop.open{display:flex}
  .modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.22);padding:18px}
  .modal h3{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:500;margin:0 0 5px}
  .modal-price{color:var(--accent-dark);font-weight:800;margin-bottom:16px}
  .field-label{display:block;font-size:12px;color:var(--muted);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.06em}
  .modal-qty{display:flex;align-items:center;gap:10px}
  .modal-qty button{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px}
  .modal-qty input{width:78px;height:42px;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:750}
  .extra-list{display:grid;gap:7px}
  .extra-option{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}
  .extra-option .extra-name{font-size:13px}
  .extra-option .extra-price{font-weight:700;color:var(--accent-dark);font-size:13px;white-space:nowrap}
  .extra-qty{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px}
  .extra-qty button{width:30px;height:30px;border:0;background:#f2ece6;border-radius:50%;font-size:17px;line-height:1}
  .extra-qty input{width:36px;height:30px;border:0;background:transparent;text-align:center;font-weight:800;padding:0;appearance:textfield}
  .extra-qty input::-webkit-outer-spin-button,.extra-qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .modal-actions button{border-radius:13px;padding:12px;border:1px solid var(--line);background:#fff;font-weight:700}
  .modal-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .no-results{padding:30px 10px;text-align:center;color:var(--muted)}
  .app,.layout,.menu-panel,.order-panel,.item-list,.cart,.cart-line,.extra-list,.modal{min-width:0}
  .brand,.brand p,.item-name,.item-desc,.cart-title,.extras-text,.extra-option .extra-name,.helper{overflow-wrap:anywhere;word-break:break-word}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr}.order-panel{position:static;order:-1}.top{align-items:flex-start;flex-direction:column}.clear-all{align-self:flex-end;margin-top:-45px}
  }
  @media(max-width:480px){
    .app{padding:14px 10px 32px}.menu-panel,.order-panel{border-radius:17px}.menu-item{grid-template-columns:1fr}.item-meta{justify-content:space-between}.modal-actions{grid-template-columns:1fr}.clear-all{margin-top:0;align-self:flex-start}
  }


  /* ===== Mobile-first phone experience ===== */
  .order-close,.mobile-order-bar,.cart-backdrop{display:none}

  @media(max-width:820px){
    html{background:var(--paper)}
    body{min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom));overflow-x:hidden}
    body.drawer-open{overflow:hidden}
    .app{max-width:560px;margin:0 auto;padding:12px 10px 28px}
    .top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;margin:0 2px 12px}
    .brand h1{font-size:29px;line-height:1.05;letter-spacing:0}
    .brand p{font-size:12.5px;line-height:1.4;margin-top:6px;max-width:34ch}
    .clear-all{align-self:start;margin:0;padding:9px 11px;font-size:12px;background:rgba(255,253,249,.82);backdrop-filter:blur(10px)}

    .layout{display:block}
    .menu-panel{padding:10px;border-radius:20px;box-shadow:0 8px 24px rgba(70,52,40,.06)}
    .tools{position:sticky;top:0;z-index:5;margin:0 -2px 8px;padding:2px;background:var(--panel)}
    .search{min-height:48px;border-radius:15px;padding:13px 14px;font-size:16px;box-shadow:0 4px 14px rgba(70,52,40,.04)}
    .tabs{gap:7px;margin:0 -2px 5px;padding:2px 2px 9px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
    .tab{min-height:42px;padding:9px 13px;scroll-snap-align:start;font-size:13px}
    .item-list{gap:4px}
    .menu-item{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px 10px;border-radius:14px;border-bottom-color:var(--line)}
    .menu-item:hover{background:transparent;border-color:transparent;border-bottom-color:var(--line)}
    .menu-item:active{background:#fbf7f2}
    .item-name{font-size:15px;line-height:1.3}
    .item-desc{font-size:12px;line-height:1.4;margin-top:4px}
    .item-meta{align-self:center;gap:9px}
    .price{font-size:14px}
    .add{width:44px;height:44px;min-width:44px;font-size:24px;box-shadow:0 5px 14px rgba(143,104,78,.2)}

    .order-panel{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:31;width:min(100%,560px);margin:0 auto;max-height:82dvh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;box-shadow:0 -18px 60px rgba(39,31,26,.22);transform:translateY(105%);transition:transform .24s ease;overscroll-behavior:contain}
    .order-panel.mobile-open{transform:translateY(0)}
    .order-panel::before{content:'';display:block;width:42px;height:4px;border-radius:999px;background:#d6cec7;margin:-4px auto 12px}
    .order-head{position:sticky;top:-16px;z-index:2;background:linear-gradient(var(--panel) 82%,rgba(255,253,249,.92));padding:16px 0 10px;margin:-16px 0 8px;grid-template-columns:minmax(0,1fr) auto auto}
    .order-head h2{font-size:25px}
    .order-close{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:22px;color:var(--muted)}
    .cart-line{padding:13px;border-radius:15px}
    .qty button{width:36px;height:36px}
    .small-btn{min-height:38px;padding:9px 10px}
    .totals{padding-bottom:2px}

    .mobile-order-bar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:18;align-items:center;justify-content:space-between;gap:12px;max-width:540px;margin:0 auto;padding:10px 11px 10px 14px;border:0;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 14px 34px rgba(45,41,38,.28);text-align:left}
    .mobile-order-bar:disabled{opacity:.55;box-shadow:0 8px 24px rgba(45,41,38,.16)}
    .mobile-order-copy{display:grid;gap:2px;min-width:0}
    .mobile-order-label{font-size:12px;opacity:.72}
    .mobile-order-count{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mobile-order-total{font-family:Georgia,"Times New Roman",serif;font-size:24px;white-space:nowrap}
    .cart-backdrop{position:fixed;inset:0;z-index:30;background:rgba(39,31,26,.42);backdrop-filter:blur(2px)}
    .cart-backdrop.open{display:block}

    .modal-backdrop{align-items:flex-end;padding:0;background:rgba(39,31,26,.48)}
    .modal{width:100%;max-width:560px;max-height:91dvh;margin:0 auto;border-radius:25px 25px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(0,0,0,.22)}
    .modal::before{content:'';display:block;width:42px;height:4px;border-radius:999px;background:#d6cec7;margin:-3px auto 13px}
    .modal h3{font-size:24px;line-height:1.12}
    .modal-qty button{width:46px;height:46px}
    .modal-qty input{height:46px;font-size:16px}
    .extra-option{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'name price' 'qty qty';padding:11px}
    .extra-option .extra-name{grid-area:name;line-height:1.3}
    .extra-option .extra-price{grid-area:price}
    .extra-qty{grid-area:qty;justify-self:start;margin-top:3px}
    .extra-qty button{width:36px;height:36px}
    .extra-qty input{width:44px;height:36px}
    .modal-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:16px -14px calc(-18px - env(safe-area-inset-bottom));padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(255,253,249,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);grid-template-columns:.75fr 1.25fr}
    .modal-actions button{min-height:48px}
  }

  @media(max-width:390px){
    .brand h1{font-size:26px}
    .brand p{display:none}
    .menu-panel{padding:8px}
    .menu-item{padding:13px 8px}
    .price{font-size:13px}
  }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>Café Order Calculator</h1>
      <p>Select products, quantities and menu extras. Totals update automatically.</p>
    </div>
    <button class="clear-all" id="clearAll" type="button">Clear order</button>
  </header>

  <main class="layout">
    <section class="menu-panel" aria-label="Menu">
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Search the menu…" autocomplete="off">
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Menu categories"></div>
      <div class="item-list" id="itemList"></div>
    </section>

    <aside class="order-panel" aria-label="Current order">
      <div class="order-head">
        <h2>Current order</h2>
        <span class="count-pill" id="orderCount">0 items</span>
        <button class="order-close" id="orderClose" type="button" aria-label="Close order">×</button>
      </div>
      <div id="cartArea"></div>
      <div class="totals">
        <div class="sum-row"><span>Total</span><strong id="grandTotal">€0,00</strong></div>
        <div class="helper">Each extra can have its own quantity (for example Bacon ×2). Extras are multiplied by the item quantity.</div>
      </div>
    </aside>
  </main>
</div>
<button class="mobile-order-bar" id="mobileOrderBar" type="button" aria-label="Open current order" disabled>
  <span class="mobile-order-copy">
    <span class="mobile-order-label">Current order</span>
    <span class="mobile-order-count" id="mobileOrderCount">No items yet</span>
  </span>
  <strong class="mobile-order-total" id="mobileOrderTotal">€0,00</strong>
</button>
<div class="cart-backdrop" id="cartBackdrop" aria-hidden="true"></div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div class="modal-price" id="modalBasePrice"></div>

    <label class="field-label" for="modalQty">Quantity</label>
    <div class="modal-qty">
      <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
      <input id="modalQty" type="number" min="1" max="99" step="1" value="1" inputmode="numeric">
      <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
    </div>

    <div id="extrasWrap">
      <div class="field-label">Extras</div>
      <div class="extra-list" id="extraList"></div>
    </div>

    <div class="modal-actions">
      <button type="button" id="cancelModal">Cancel</button>
      <button type="button" class="primary" id="confirmAdd">Add to order · €0,00</button>
    </div>
  </div>
</div>

const $ = (id) => document.getElementById(id);
const els = { tabs:$('tabs'), list:$('itemList'), search:$('search'), cart:$('cartArea'), count:$('orderCount'), total:$('grandTotal'), clear:$('clearAll'), backdrop:$('modalBackdrop'), title:$('modalTitle'), base:$('modalBasePrice'), qty:$('modalQty'), extras:$('extraList'), extrasWrap:$('extrasWrap'), confirm:$('confirmAdd'), cancel:$('cancelModal'), minus:$('qtyMinus'), plus:$('qtyPlus') };

const mobileOrderBar=$('mobileOrderBar');
const mobileOrderCount=$('mobileOrderCount');
const mobileOrderTotal=$('mobileOrderTotal');
const cartBackdrop=$('cartBackdrop');
const orderPanel=document.querySelector('.order-panel');
const orderClose=$('orderClose');
const mobileMedia=window.matchMedia('(max-width:820px)');
function openOrderDrawer(){
  if(!mobileMedia.matches || !state.cart.length) return;
  orderPanel.classList.add('mobile-open');
  cartBackdrop.classList.add('open');
  cartBackdrop.setAttribute('aria-hidden','false');
  document.body.classList.add('drawer-open');
}
function closeOrderDrawer(){
  orderPanel.classList.remove('mobile-open');
  cartBackdrop.classList.remove('open');
  cartBackdrop.setAttribute('aria-hidden','true');
  document.body.classList.remove('drawer-open');
}
mobileOrderBar.addEventListener('click',openOrderDrawer);
orderClose.addEventListener('click',closeOrderDrawer);
cartBackdrop.addEventListener('click',closeOrderDrawer);
mobileMedia.addEventListener?.('change',e=>{ if(!e.matches) closeOrderDrawer(); });


function fmt(n){ return euro.format(Number.isFinite(n) ? n : 0); }
function clampQty(v){ const n=Math.trunc(Number(v)); return Number.isFinite(n)?Math.min(99,Math.max(1,n)):1; }
function currentSection(){ return menu.find(s=>s.id===state.category) || menu[0]; }
function itemUnitTotal(item, extras){ return (item.price || 0) + extras.reduce((s,e)=>s+(e.price*e.qty),0); }
function itemKey(item, extras){ return item.name+'||'+extras.map(e=>e.name+'@'+e.price+'x'+e.qty).sort().join('|'); }
function clampExtraQty(v){ const n=Math.trunc(Number(v)); return Number.isFinite(n)?Math.min(20,Math.max(0,n)):0; }

function renderTabs(){
  els.tabs.innerHTML='';
  menu.forEach(sec=>{
    const b=document.createElement('button');
    b.type='button'; b.className='tab'+(sec.id===state.category?' active':'');
    b.textContent=`${sec.icon} ${sec.label}`;
    b.setAttribute('role','tab'); b.setAttribute('aria-selected',sec.id===state.category?'true':'false');
    b.addEventListener('click',()=>{state.category=sec.id; renderTabs(); renderMenu();});
    els.tabs.appendChild(b);
  });
}

function renderMenu(){
  const q=state.search.trim().toLocaleLowerCase('de');
  const sec=currentSection();
  const items=sec.items.filter(it=>!q || (it.name+' '+it.description).toLocaleLowerCase('de').includes(q));
  els.list.innerHTML='';
  if(!items.length){ els.list.innerHTML='<div class="no-results">No matching menu items.</div>'; return; }
  items.forEach(item=>{
    const row=document.createElement('div'); row.className='menu-item'+(item.price==null?' unavailable':'');
    const left=document.createElement('div');
    const name=document.createElement('div'); name.className='item-name'; name.textContent=item.name; left.appendChild(name);
    if(item.description){ const d=document.createElement('div'); d.className='item-desc'; d.textContent=item.description; left.appendChild(d); }
    if(item.extras.length){ const ex=document.createElement('div'); ex.className='item-desc'; ex.textContent=`Extras available: ${item.extras.length}`; left.appendChild(ex); }
    const meta=document.createElement('div'); meta.className='item-meta';
    const price=document.createElement('span'); price.className='price'; price.textContent=item.price==null?'Price missing':fmt(item.price); meta.appendChild(price);
    const add=document.createElement('button'); add.type='button'; add.className='add'; add.textContent='+'; add.disabled=item.price==null; add.setAttribute('aria-label',`Add ${item.name}`); add.addEventListener('click',()=>openModal(item)); meta.appendChild(add);
    row.append(left,meta); els.list.appendChild(row);
  });
}

function openModal(item, cartIndex=null){
  closeOrderDrawer();
  state.selectedItem=item; state.editing=cartIndex;
  const existing=cartIndex==null?null:state.cart[cartIndex];
  els.title.textContent=item.name; els.base.textContent=`Base price: ${fmt(item.price)}`;
  els.qty.value=existing?existing.qty:1; els.extras.innerHTML='';
  if(item.extras.length){
    els.extrasWrap.style.display='block';
    item.extras.forEach((ex,i)=>{
      const row=document.createElement('div'); row.className='extra-option';
      const name=document.createElement('span'); name.className='extra-name'; name.textContent=ex.name;
      const price=document.createElement('span'); price.className='extra-price'; price.textContent='+'+fmt(ex.price)+' each';
      const qtyWrap=document.createElement('div'); qtyWrap.className='extra-qty';
      const minus=document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label',`Decrease ${ex.name}`);
      const input=document.createElement('input'); input.type='number'; input.min='0'; input.max='20'; input.step='1'; input.inputMode='numeric'; input.dataset.index=i;
      const previous=existing?existing.extras.find(e=>e.name===ex.name && e.price===ex.price):null;
      input.value=previous?previous.qty:0;
      const plus=document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.setAttribute('aria-label',`Increase ${ex.name}`);
      minus.addEventListener('click',()=>{input.value=clampExtraQty(Number(input.value)-1); updateModalTotal();});
      plus.addEventListener('click',()=>{input.value=clampExtraQty(Number(input.value)+1); updateModalTotal();});
      input.addEventListener('input',()=>{input.value=clampExtraQty(input.value); updateModalTotal();});
      qtyWrap.append(minus,input,plus); row.append(name,price,qtyWrap); els.extras.appendChild(row);
    });
  } else { els.extrasWrap.style.display='none'; }
  els.confirm.textContent=(existing?'Update order · ':'Add to order · ')+fmt(modalTotal());
  els.backdrop.classList.add('open'); els.backdrop.setAttribute('aria-hidden','false'); setTimeout(()=>els.qty.focus(),0);
}
function closeModal(){ els.backdrop.classList.remove('open'); els.backdrop.setAttribute('aria-hidden','true'); state.selectedItem=null; state.editing=null; }
function selectedExtras(){
  if(!state.selectedItem) return [];
  return [...els.extras.querySelectorAll('.extra-qty input')].map(input=>{
    const ex=state.selectedItem.extras[Number(input.dataset.index)]; const qty=clampExtraQty(input.value);
    return ex && qty>0 ? {...ex,qty} : null;
  }).filter(Boolean);
}
function modalTotal(){ if(!state.selectedItem) return 0; return clampQty(els.qty.value)*itemUnitTotal(state.selectedItem,selectedExtras()); }
function updateModalTotal(){ els.qty.value=clampQty(els.qty.value); els.confirm.textContent=(state.editing==null?'Add to order · ':'Update order · ')+fmt(modalTotal()); }

function commitModal(){
  const item=state.selectedItem; if(!item) return;
  const qty=clampQty(els.qty.value); const extras=selectedExtras();
  if(state.editing!=null){ state.cart[state.editing]={item,qty,extras}; }
  else {
    const key=itemKey(item,extras); const found=state.cart.findIndex(l=>itemKey(l.item,l.extras)===key);
    if(found>=0) state.cart[found].qty=Math.min(99,state.cart[found].qty+qty); else state.cart.push({item,qty,extras});
  }
  closeModal(); renderCart();
}

function renderCart(){
  els.cart.innerHTML='';
  if(!state.cart.length){ els.cart.innerHTML='<div class="empty">Your order is empty.<br>Select an item from the menu.</div>'; }
  else {
    const wrap=document.createElement('div'); wrap.className='cart';
    state.cart.forEach((line,idx)=>{
      const card=document.createElement('div'); card.className='cart-line';
      const top=document.createElement('div'); top.className='cart-top';
      const t=document.createElement('div'); t.className='cart-title'; t.textContent=line.item.name;
      const lp=document.createElement('div'); lp.className='line-price'; lp.textContent=fmt(line.qty*itemUnitTotal(line.item,line.extras)); top.append(t,lp); card.appendChild(top);
      if(line.extras.length){ const et=document.createElement('div'); et.className='extras-text'; et.textContent=line.extras.map(e=>`${e.name} ×${e.qty} (+${fmt(e.price*e.qty)} per item)`).join(' · '); card.appendChild(et); }
      const controls=document.createElement('div'); controls.className='cart-controls';
      const qty=document.createElement('div'); qty.className='qty';
      const minus=document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label','Decrease quantity'); minus.addEventListener('click',()=>{line.qty--; if(line.qty<1) state.cart.splice(idx,1); renderCart();});
      const val=document.createElement('span'); val.textContent=line.qty;
      const plus=document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.setAttribute('aria-label','Increase quantity'); plus.addEventListener('click',()=>{line.qty=Math.min(99,line.qty+1); renderCart();}); qty.append(minus,val,plus);
      const acts=document.createElement('div'); acts.className='line-actions';
      const edit=document.createElement('button'); edit.type='button'; edit.className='small-btn'; edit.textContent='Edit extras'; edit.addEventListener('click',()=>openModal(line.item,idx));
      const remove=document.createElement('button'); remove.type='button'; remove.className='small-btn remove'; remove.textContent='Remove'; remove.addEventListener('click',()=>{state.cart.splice(idx,1); renderCart();}); acts.append(edit,remove);
      controls.append(qty,acts); card.appendChild(controls); wrap.appendChild(card);
    });
    els.cart.appendChild(wrap);
  }
  const qtyTotal=state.cart.reduce((s,l)=>s+l.qty,0); const total=state.cart.reduce((s,l)=>s+l.qty*itemUnitTotal(l.item,l.extras),0);
  els.count.textContent=`${qtyTotal} ${qtyTotal===1?'item':'items'}`; els.total.textContent=fmt(total);
  mobileOrderCount.textContent=qtyTotal?`${qtyTotal} ${qtyTotal===1?'item':'items'} · Tap to review`:'No items yet';
  mobileOrderTotal.textContent=fmt(total);
  mobileOrderBar.disabled=qtyTotal===0;
  if(qtyTotal===0) closeOrderDrawer();
}

els.search.addEventListener('input',e=>{state.search=e.target.value; renderMenu();});
els.clear.addEventListener('click',()=>{ if(state.cart.length && !confirm('Clear the whole order?')) return; state.cart=[]; renderCart(); });
els.cancel.addEventListener('click',closeModal); els.confirm.addEventListener('click',commitModal);
els.minus.addEventListener('click',()=>{els.qty.value=clampQty(Number(els.qty.value)-1); updateModalTotal();});
els.plus.addEventListener('click',()=>{els.qty.value=clampQty(Number(els.qty.value)+1); updateModalTotal();});
els.qty.addEventListener('input',updateModalTotal);
els.backdrop.addEventListener('click',e=>{if(e.target===els.backdrop) closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ if(els.backdrop.classList.contains('open')) closeModal(); else closeOrderDrawer(); }});
renderTabs(); renderMenu(); renderCart();
</script>
</body>
</html>
